name: Polyglot Pipeline CI/CD Engine

# ==============================================================================
# CAPSTONE ARCHITECTURE: DISTRIBUTED REAL-TIME WEB SENTIMENT ANALYZER
# CONTINUOUS INTEGRATION & VERIFICATION PIPELINE
# Target File: .github/workflows/deploy.yml
# ==============================================================================

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # 1. Parallel Language Syntax & Unit Validation
  # ---------------------------------------------------------------------------
  lint-and-validate:
    name: Microservice Static Analysis
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - service: "Ruby Ingestion Engine"
            path: "services/ruby-scraper"
            lang: "ruby"
          - service: "Rust Preprocessor"
            path: "services/rust-preprocessor"
            lang: "rust"
          - service: "Python AI Core"
            path: "services/python-ai"
            lang: "python"
          - service: "Go API Gateway"
            path: "services/go-gateway"
            lang: "go"

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      # Ruby Validation
      - name: Setup Ruby
        if: matrix.lang == 'ruby'
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: ${{ matrix.path }}

      - name: Validate Ruby Syntax
        if: matrix.lang == 'ruby'
        working-directory: ${{ matrix.path }}
        run: |
          ruby -c scraper.rb

      # Rust Validation
      - name: Setup Rust Toolchain
        if: matrix.lang == 'rust'
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.78.0

      - name: Compile & Check Rust
        if: matrix.lang == 'rust'
        working-directory: ${{ matrix.path }}
        run: |
          cargo check --release

      # Python Validation
      - name: Setup Python
        if: matrix.lang == 'python'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: services/python-ai/requirements.txt

      - name: Validate Python Dependencies & Syntax
        if: matrix.lang == 'python'
        working-directory: ${{ matrix.path }}
        run: |
          pip install --no-cache-dir torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
          python -m py_compile main.py

      # Go Validation
      - name: Setup Go
        if: matrix.lang == 'go'
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: services/go-gateway/go.sum

      - name: Vet & Compile Go Gateway
        if: matrix.lang == 'go'
        working-directory: ${{ matrix.path }}
        run: |
          go mod tidy
          go vet ./...
          go build -o /dev/null main.go

  # ---------------------------------------------------------------------------
  # 2. Multi-Stage Docker Container Build & Orchestration Smoke Test
  # ---------------------------------------------------------------------------
  docker-orchestration:
    name: Docker BuildKit & Compose Healthcheck
    runs-on: ubuntu-latest
    needs: [lint-and-validate]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Cache Docker Layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      - name: Generate Dummy Production .env
        run: |
          cat <<EOF > .env
          RABBITMQ_USER=admin
          RABBITMQ_PASSWORD=securepass123
          SUPABASE_URL=https://mock.supabase.co
          SUPABASE_ANON_KEY=mock-key
          SUPABASE_SERVICE_ROLE_KEY=mock-service-key
          RSS_FEED_URL=https://feeds.bbci.co.uk/news/technology/rss.xml
          SCRAPE_INTERVAL_SECONDS=60
          RUST_WORKER_THREADS=2
          ALLOWED_ORIGIN=*
          EOF

      - name: Build All Microservice Images
        run: |
          DOCKER_BUILDKIT=1 docker compose build

      - name: Verify Image Footprints & Artifacts
        run: |
          docker images --format "table {{.Repository}}\t{{.Tag}}\t{{.Size}}"

      - name: Execute End-to-End Orchestration Boot
        run: |
          docker compose up -d rabbitmq
          echo "Waiting for RabbitMQ health probe..."
          sleep 12
          docker compose ps
